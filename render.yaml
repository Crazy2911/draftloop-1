services:
  - type: web
    name: draftloop-api
    runtime: python
    plan: free
    rootDir: backend

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

      - key: AI_PROVIDER
        value: gemini

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      - key: AI_TIMEOUT_SECONDS
        value: "90"

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false

      - key: SUPABASE_SECRET_KEY
        sync: false

      - key: SUPABASE_TIMEOUT_SECONDS
        value: "20"

      - key: CORS_ORIGINS
        sync: false

      - key: MAX_ESSAY_CHARACTERS
        value: "30000"